name: contextcapsule
description: >-
  Optional hosted transport for short-lived coding handoffs.
  Create and fetch public-by-URL capsules carrying status,
  decisions, verification limits, and next steps between coding agents.
icon: package
author: contextcapsule
sourceUrl: https://github.com/Johnny-Z13/context-capsule/tree/main/packages/mcp-server
license: MIT
runtime: node
startCommand:
  command: node
  args:
    - dist/bin/cli.js
  env:
    CONTEXTCAPSULE_API_KEY:
      description: Your Context Capsule API key for creating hosted capsules
      required: false
